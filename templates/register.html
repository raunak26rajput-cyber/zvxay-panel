{% extends "base.html" %}
{% block title %}Register · ZVXAY{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon">🚀</div>
      <h1>Create Account</h1>
      <p>Register and wait for owner approval</p>
    </div>

    <form method="post" action="{{ url_for('register_post') }}" class="form-grid">
      <div>
        <span class="form-label">Username</span>
        <input name="username" required autocomplete="username" placeholder="choose a username" />
      </div>
      <div>
        <span class="form-label">Password</span>
        <input name="password" type="password" required autocomplete="new-password" placeholder="min 6 characters" />
      </div>
      <button class="btn btn-primary w-full" type="submit">Create Account</button>
    </form>

    <div class="alert alert-info" style="margin-top:14px;font-size:13px">
      ℹ️ New accounts require <strong>owner approval</strong> before you can host bots.
    </div>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Login</a>
    </div>
  </div>
</div>

{% endblock %}
